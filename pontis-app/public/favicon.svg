<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- Background -->
  <rect width="32" height="32" rx="7" fill="#4f46e5"/>

  <!-- Anchor cables (tower top → outside ground anchors) -->
  <line x1="9.25" y1="5" x2="2"  y2="21" stroke="white" stroke-width="1.2" stroke-linecap="round" opacity="0.65"/>
  <line x1="22.75" y1="5" x2="30" y2="21" stroke="white" stroke-width="1.2" stroke-linecap="round" opacity="0.65"/>

  <!-- Main span cable -->
  <path d="M9.25 5 Q16 16 22.75 5" stroke="white" stroke-width="2" fill="none" stroke-linecap="round"/>

  <!-- Suspenders -->
  <line x1="13"  y1="8.8" x2="13"  y2="21" stroke="white" stroke-width="1"   opacity="0.75"/>
  <line x1="16"  y1="10"  x2="16"  y2="21" stroke="white" stroke-width="1"   opacity="0.75"/>
  <line x1="19"  y1="8.8" x2="19"  y2="21" stroke="white" stroke-width="1"   opacity="0.75"/>

  <!-- Towers (drawn over cable so they appear solid) -->
  <rect x="7.5"  y="4" width="3.5" height="17" rx="1" fill="white"/>
  <rect x="21"   y="4" width="3.5" height="17" rx="1" fill="white"/>

  <!-- Deck -->
  <rect x="1" y="20" width="30" height="3.5" rx="1.5" fill="white"/>

  <!-- Water ripples -->
  <path d="M4 26.5 Q7.5 25.5 11 26.5"  stroke="white" stroke-width="1.2" fill="none" stroke-linecap="round" opacity="0.3"/>
  <path d="M13 28   Q16.5 27   20 28"  stroke="white" stroke-width="1.2" fill="none" stroke-linecap="round" opacity="0.3"/>
  <path d="M21 26.5 Q24.5 25.5 28 26.5" stroke="white" stroke-width="1.2" fill="none" stroke-linecap="round" opacity="0.3"/>
</svg>
