[phases.setup]
nixPkgs = [
  "php83",
  "php83Packages.composer",
  "php83Extensions.pdo",
  "php83Extensions.pdo_pgsql",
  "php83Extensions.pgsql",
  "php83Extensions.mbstring",
  "php83Extensions.xml",
  "php83Extensions.curl",
  "php83Extensions.tokenizer",
  "php83Extensions.bcmath",
  "php83Extensions.ctype",
  "php83Extensions.fileinfo",
  "php83Extensions.dom",
  "php83Extensions.openssl",
  "php83Extensions.zip"
]

[phases.install]
cmds = [
  "mkdir -p bootstrap/cache storage/logs storage/app storage/framework/cache storage/framework/sessions storage/framework/views",
  "chmod -R 777 bootstrap/cache storage",
  "composer install --no-dev --optimize-autoloader"
]

[phases.build]
cmds = [
  "php artisan config:cache",
  "php artisan route:cache",
  "php artisan view:cache"
]

[start]
cmd = "php artisan migrate --force && php artisan db:seed --class=SuperAdminSeeder --force && php artisan db:seed --class=WorkshopSeeder --force && php artisan serve --host=0.0.0.0 --port=$PORT"
